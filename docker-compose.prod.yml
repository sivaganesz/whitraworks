# =======================================================
# WhitraWorks Multi-Tenant Platform — Production Compose
# =======================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: whitraworks-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-whitraworks_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-whitraworks_prod}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whitraworks-internal

  redis:
    image: redis:7-alpine
    container_name: whitraworks-prod-redis
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whitraworks-internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: whitraworks-prod-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-whitraworks_prod}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COOKIE_SECRET: ${COOKIE_SECRET:-whitraworks-super-secure-production-cookie-secret-key-32chars}
      JWT_SECRET: ${JWT_SECRET:-whitraworks-super-secure-production-jwt-secret-key-32chars}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-whitraworks.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-notifications@whitraworks.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - whitraworks-internal

  ops-admin:
    build:
      context: .
      dockerfile: apps/ops-admin/Dockerfile
    container_name: whitraworks-prod-ops-admin
    restart: always
    networks:
      - whitraworks-internal

  tenant-admin:
    build:
      context: .
      dockerfile: apps/tenant-admin/Dockerfile
    container_name: whitraworks-prod-tenant-admin
    restart: always
    networks:
      - whitraworks-internal

  gateway:
    image: nginx:1.27-alpine
    container_name: whitraworks-prod-gateway
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - ops-admin
      - tenant-admin
    networks:
      - whitraworks-internal

networks:
  whitraworks-internal:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

