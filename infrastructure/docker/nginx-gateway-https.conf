# HTTPS staging tenant workspaces and staging apex.
server {
    listen 443 ssl;
    server_name
        stage.whitraworks.online
        ~^[a-z0-9-]+\.stage\.whitraworks\.online$;

    ssl_certificate /etc/ssl/whitraworks/fullchain.cer;
    ssl_certificate_key /etc/ssl/whitraworks/whitraworks.key;

    client_max_body_size 25M;

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://tenant_admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
