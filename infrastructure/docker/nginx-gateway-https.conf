upstream api_service {
    server api:4000;
}

upstream ops_admin_service {
    server ops-admin:80;
}

upstream tenant_admin_service {
    server tenant-admin:80;
}

# Reject unknown HTTP hosts.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Redirect staging hosts to HTTPS.
server {
    listen 80;
    server_name
        stage.whitraworks.online
        ops.stage.whitraworks.online
        api.stage.whitraworks.online
        ~^[a-z0-9-]+\.stage\.whitraworks\.online$;

    return 301 https://$host$request_uri;
}

# Preserve existing operator routes over HTTP.
server {
    listen 80;
    server_name ops.whitraworks.com ops.localhost;

    client_max_body_size 25M;

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ops_admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Preserve existing API routes over HTTP.
server {
    listen 80;
    server_name api.whitraworks.com api.localhost;

    client_max_body_size 25M;

    location / {
        proxy_pass http://api_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Preserve existing production and localhost tenant routes over HTTP.
server {
    listen 80;
    server_name
        ~^(?<tenant_slug_prod>.+)\.whitraworks\.com$
        ~^(?<tenant_slug_local>.+)\.localhost$;

    client_max_body_size 25M;

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://tenant_admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Reject unknown HTTPS hosts.
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/whitraworks/fullchain.cer;
    ssl_certificate_key /etc/ssl/whitraworks/whitraworks.key;

    return 444;
}

