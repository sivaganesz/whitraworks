# =======================================================
# WhitraWorks Production Reverse Proxy Gateway Config
# Host-based routing for multi-tenant data plane & ops plane
# =======================================================

upstream api_service {
    server api:4000;
}

upstream ops_admin_service {
    server ops-admin:80;
}

upstream tenant_admin_service {
    server tenant-admin:80;
}

# 1. Platform Operator Plane (ops.whitraworks.com / ops.localhost)
server {
    listen 80;
    server_name ops.stage.whitraworks.online ops.whitraworks.com ops.localhost;

    client_max_body_size 25M;

    # API Proxy Routing
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ops Admin Frontend SPA
    location / {
        proxy_pass http://ops_admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Dedicated API Subdomain (api.whitraworks.com / api.localhost)
server {
    listen 80;
    server_name api.stage.whitraworks.online api.whitraworks.com api.localhost;

    client_max_body_size 25M;

    location / {
        proxy_pass http://api_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Tenant Workspaces & Wildcard Subdomains (*.whitraworks.com / *.localhost)
server {
    listen 80 default_server;
    server_name stage.whitraworks.online ~^(?<tenant_slug>[a-z0-9-]+)\.stage\.whitraworks\.online$ ~^(?<tenant_slug_prod>.+)\.whitraworks\.com$ ~^(?<tenant_slug_local>.+)\.localhost$ _;

    client_max_body_size 25M;

    # API Proxy Routing
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tenant Admin Frontend SPA
    location / {
        proxy_pass http://tenant_admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

