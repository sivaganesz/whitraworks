name: WhitraWorks Platform CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Monorepo Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12.9.1

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Typecheck & Build Monorepo
        run: pnpm build

      - name: Run Linters
        run: pnpm lint

  test-suites:
    name: Vitest E2E & Unit Test Suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: whitraworks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d whitraworks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/whitraworks_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-min-32-chars-long-whitraworks
      COOKIE_SECRET: test-cookie-secret-min-32-chars-whitraworks
      PLATFORM_DOMAIN: whitraworks.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12.9.1

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run Prisma DB Push on Test Database
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/whitraworks_test?schema=public
        run: pnpm --filter @whitraworks/database exec prisma db push --skip-generate

      - name: Seed Test Database
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/whitraworks_test?schema=public
          INITIAL_SUPERADMIN_EMAIL: superadmin@whitraworks.com
          INITIAL_SUPERADMIN_PASSWORD: ChangeMeImmediately123!
        run: pnpm db:seed

      - name: Execute Vitest Suites
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/whitraworks_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-min-32-chars-long-whitraworks
          COOKIE_SECRET: test-cookie-secret-min-32-chars-whitraworks
          PLATFORM_DOMAIN: whitraworks.com
        run: pnpm test

  docker-build-verification:
    name: Multi-Stage Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: whitraworks/api:test-ci

      - name: Build Ops Admin Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/ops-admin/Dockerfile
          push: false
          tags: whitraworks/ops-admin:test-ci

      - name: Build Tenant Admin Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/tenant-admin/Dockerfile
          push: false
          tags: whitraworks/tenant-admin:test-ci
