name: WhitraWorks Platform CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - configuration
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Monorepo Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12.9.1

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Typecheck & Build Monorepo
        run: pnpm build

      - name: Run Linters
        run: pnpm lint

  test-suites:
    name: Vitest E2E & Unit Test Suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: whitraworks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d whitraworks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/whitraworks_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-min-32-chars-long-whitraworks
      COOKIE_SECRET: test-cookie-secret-min-32-chars-whitraworks
      PLATFORM_DOMAIN: whitraworks.online

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12.9.1

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run Prisma DB Push on Test Database
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/whitraworks_test?schema=public
        run: pnpm --filter @whitraworks/database exec prisma db push --skip-generate

      - name: Seed Test Database
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/whitraworks_test?schema=public
          INITIAL_SUPERADMIN_EMAIL: superadmin@whitraworks.online
          INITIAL_SUPERADMIN_PASSWORD: ChangeMeImmediately123!
        run: pnpm db:seed

      - name: Execute Vitest Suites
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/whitraworks_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-min-32-chars-long-whitraworks
          COOKIE_SECRET: test-cookie-secret-min-32-chars-whitraworks
          PLATFORM_DOMAIN: whitraworks.online
        run: pnpm test

  docker-build-verification:
    name: Multi-Stage Docker Container Build & GHCR Publish
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-suites]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'configuration')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: tags
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" = "configuration" ]; then
            echo "API_TAGS=ghcr.io/sivaganesz/whitraworks-api:stage,ghcr.io/sivaganesz/whitraworks-api:${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "OPS_TAGS=ghcr.io/sivaganesz/whitraworks-ops-admin:stage,ghcr.io/sivaganesz/whitraworks-ops-admin:${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "TENANT_TAGS=ghcr.io/sivaganesz/whitraworks-tenant-admin:stage,ghcr.io/sivaganesz/whitraworks-tenant-admin:${{ github.sha }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "API_TAGS=ghcr.io/sivaganesz/whitraworks-api:latest,ghcr.io/sivaganesz/whitraworks-api:${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "OPS_TAGS=ghcr.io/sivaganesz/whitraworks-ops-admin:latest,ghcr.io/sivaganesz/whitraworks-ops-admin:${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "TENANT_TAGS=ghcr.io/sivaganesz/whitraworks-tenant-admin:latest,ghcr.io/sivaganesz/whitraworks-tenant-admin:${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "API_TAGS=ghcr.io/sivaganesz/whitraworks-api:${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "OPS_TAGS=ghcr.io/sivaganesz/whitraworks-ops-admin:${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "TENANT_TAGS=ghcr.io/sivaganesz/whitraworks-tenant-admin:${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'configuration') }}
          tags: ${{ steps.tags.outputs.API_TAGS }}

      - name: Build and Push Ops Admin Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/ops-admin/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'configuration') }}
          tags: ${{ steps.tags.outputs.OPS_TAGS }}

      - name: Build and Push Tenant Admin Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/tenant-admin/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'configuration') }}
          tags: ${{ steps.tags.outputs.TENANT_TAGS }}

  deploy-staging:
    name: Deploy to Azure Staging VM
    runs-on: ubuntu-latest
    needs: [docker-build-verification]
    # ACTIVATION GUARD:
    # 1. Runs strictly on push to 'configuration' (never PRs, manual runs, main, or master).
    # 2. Requires vars.ENABLE_STAGING_DEPLOYMENT == 'true' to be explicitly defined as a REPOSITORY-LEVEL
    #    Actions variable (Repository Settings -> Secrets and variables -> Actions -> Variables).
    #    NOTE: Do NOT define this as an Environment-level variable; GitHub Actions evaluates job-level
    #    'if' conditions before selecting environments, meaning environment-scoped vars are unavailable here.
    #    While unset or not 'true', this entire job is safely skipped without connecting to the VM.
    if: github.event_name == 'push' && github.ref_name == 'configuration' && vars.ENABLE_STAGING_DEPLOYMENT == 'true'
    environment: staging
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Configure SSH Authentication & Pinned Host Key
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify VM Preconditions and Deploy Commit ${{ github.sha }}
        env:
          VM_HOST: ${{ secrets.STAGING_SSH_HOST }}
          VM_USER: ${{ secrets.STAGING_SSH_USER }}
          VM_PORT: ${{ secrets.STAGING_SSH_PORT }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VM_PORT}" -o StrictHostKeyChecking=yes "${VM_USER}@${VM_HOST}" \
            "bash -s" -- "${TARGET_SHA}" << 'EOF'
            set -Eeuo pipefail
            TARGET_SHA="$1"
            DEPLOY_DIR="/home/azureuser/whitraworks"

            echo "[1/5] Checking repository directory..."
            if [ ! -d "${DEPLOY_DIR}/.git" ]; then
              echo "ERROR: Directory ${DEPLOY_DIR} is not a valid git repository." >&2
              exit 1
            fi
            cd "${DEPLOY_DIR}"

            echo "[2/5] Verifying branch and working tree state..."
            CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
            if [ "${CURRENT_BRANCH}" != "configuration" ]; then
              echo "ERROR: VM repository is on '${CURRENT_BRANCH}', expected 'configuration'." >&2
              exit 1
            fi

            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: VM working tree is dirty. Aborting to protect local modifications." >&2
              git status --short >&2
              exit 1
            fi

            echo "[3/5] Fetching and fast-forwarding to target commit ${TARGET_SHA}..."
            git fetch origin configuration
            git merge --ff-only "${TARGET_SHA}"

            DEPLOYED_SHA="$(git rev-parse HEAD)"
            if [ "${DEPLOYED_SHA}" != "${TARGET_SHA}" ]; then
              echo "ERROR: Deployed SHA (${DEPLOYED_SHA}) does not match expected workflow run SHA (${TARGET_SHA})." >&2
              exit 1
            fi

            echo "[4/5] Verifying required deployment files..."
            for req in "docker-compose.stage.yml" ".env.stage" "scripts/deploy-staging.sh"; do
              if [ ! -f "${req}" ]; then
                echo "ERROR: Required deployment file '${req}' not found in ${DEPLOY_DIR}." >&2
                exit 1
              fi
            done

            echo "[5/5] Executing staging deployment script..."
            bash scripts/deploy-staging.sh
          EOF

      - name: Verify Public Gateway HTTPS Health Probes
        run: |
          echo "Probing API HTTPS health..."
          curl -fsS --retry 6 --retry-delay 5 --max-time 10 https://api.stage.whitraworks.online/health

          echo "Probing Operations Dashboard HTTPS health..."
          curl -fsS --retry 6 --retry-delay 5 --max-time 10 https://ops.stage.whitraworks.online/health

          echo "Probing Tenant Workspace HTTPS health..."
          curl -fsS --retry 6 --retry-delay 5 --max-time 10 https://stage.whitraworks.online/health

